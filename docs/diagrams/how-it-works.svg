<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-label="Tags in Go models, or catalog files written by hand, are loaded as a catalog, which is checked against the database and rendered as masked views">
<defs>
<marker id="hw-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0.5,1 L9.5,5 L0.5,9 L2.5,5 z"/></marker>
</defs>
<rect class="card" x="0" y="20" width="190" height="80" rx="10"/>
<rect class="card" x="0" y="130" width="190" height="80" rx="10"/>
<rect class="card" x="265" y="75" width="190" height="80" rx="10"/>
<rect class="card" x="530" y="20" width="190" height="80" rx="10"/>
<rect class="card" x="530" y="130" width="190" height="80" rx="10"/>
<path class="edge" d="M190,60 L224,60 L224,105 L261.5,105" marker-end="url(#hw-a)"/>
<path class="edge" d="M190,170 L224,170 L224,125 L261.5,125" marker-end="url(#hw-a)"/>
<path class="edge" d="M455,105 L492,105 L492,60 L526.5,60" marker-end="url(#hw-a)"/>
<path class="edge" d="M455,125 L492,125 L492,170 L526.5,170" marker-end="url(#hw-a)"/>
<text x="16" y="48" class="title">Go models</text>
<text x="16" y="68" class="small muted">pii tags, registered</text>
<text x="16" y="84" class="mono small">umbra.Model[T]</text>
<text x="16" y="158" class="title">Catalog files</text>
<text x="16" y="178" class="small muted">written by hand</text>
<text x="16" y="194" class="mono small">catalog/postgres/*.pii</text>
<text x="281" y="103" class="title">The catalog</text>
<text x="281" y="123" class="small muted">every column, classified</text>
<text x="281" y="139" class="mono small">umbra.Load</text>
<text x="546" y="48" class="title">Check</text>
<text x="546" y="68" class="small muted">against the database</text>
<text x="546" y="84" class="mono small">umbra check</text>
<text x="546" y="158" class="title">Masked views</text>
<text x="546" y="178" class="small muted">PostgreSQL and BigQuery</text>
<text x="546" y="194" class="mono small">umbra views</text>
</svg>
