repos:
  -   repo: local
      hooks:
      -   id: go-formatting
          name: Go formatting
          description: Run golangci-lint's formatters in every module.
          entry: just fmt
          pass_filenames: false
          types: [file, go]
          language: system
      -   id: go-lint
          name: Go lint
          description: Run golangci-lint on every module.
          entry: just golangci
          pass_filenames: false
          types: [file, go]
          language: system
      -   id: zenith-architecture
          name: Zenith architecture
          description: Check umbra's own contracts, in zenith.toml, on the files that git tracks.
          entry: zenith check --tracked
          pass_filenames: false
          files: (\.go|go\.mod|zenith\.toml)$
          language: system
