version: 2
updates:
  - package-ecosystem: gomod
    directory: /integration
    schedule:
      interval: monthly
    groups:
      go-dependencies:
        patterns: ["*"]
    ignore:
      # The library itself, which the module replaces with this checkout.
      - dependency-name: github.com/feds01/umbra
    commit-message:
      prefix: "build(deps)"

  # The command requires a release of the library, which this bumps once there is one.
  - package-ecosystem: gomod
    directory: /cmd/umbra
    schedule:
      interval: monthly
    groups:
      go-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
